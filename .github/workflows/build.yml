name: Build WebRTC APM native libraries

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (all runs all three platforms)
        required: true
        type: choice
        default: all
        options: [all, android, ios, harmony]
      android_arm64:
        description: Build Android ARM64 (arm64-v8a; ignored for iOS and Harmony)
        required: false
        type: boolean
        default: true
      android_armv7:
        description: Build Android ARMv7 (armeabi-v7a; ignored for iOS and Harmony)
        required: false
        type: boolean
        default: false
      android_x86:
        description: Build Android x86 (ignored for iOS and Harmony)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  host-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and run host C API smoke
        run: python scripts/build.py host --jobs 2

  build-android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Resolve Android ABI selection
        id: android_abis
        shell: bash
        env:
          ANDROID_ARM64: ${{ inputs.android_arm64 }}
          ANDROID_ARMV7: ${{ inputs.android_armv7 }}
          ANDROID_X86: ${{ inputs.android_x86 }}
        run: |
          selected_abis=()
          if [[ "$ANDROID_ARM64" == "true" ]]; then
            selected_abis+=(arm64-v8a)
          fi
          if [[ "$ANDROID_ARMV7" == "true" ]]; then
            selected_abis+=(armeabi-v7a)
          fi
          if [[ "$ANDROID_X86" == "true" ]]; then
            selected_abis+=(x86)
          fi
          if (( ${#selected_abis[@]} == 0 )); then
            echo '::error::Select at least one Android ABI.'
            exit 1
          fi
          echo "abis=${selected_abis[*]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: python -m pip install -r requirements-build.txt
      - name: Install locked Android NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Build Android libraries
        env:
          SELECTED_ABIS: ${{ steps.android_abis.outputs.abis }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME:?Android SDK is missing}/ndk/27.2.12479018"
          read -r -a selected_abis <<< "$SELECTED_ABIS"
          python scripts/build.py android --android-abis "${selected_abis[@]}" --jobs 2
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: webrtc-apm-android-${{ github.run_id }}
          path: dist/webrtc-apm-android.zip*
          if-no-files-found: error
          retention-days: 7

  build-ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Verify Apple toolchain
        run: xcodebuild -version
      - name: Build iPhoneOS ARM64 framework
        run: python scripts/build.py ios --jobs 3
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: webrtc-apm-ios-${{ github.run_id }}
          path: dist/webrtc-apm-ios.zip*
          if-no-files-found: error
          retention-days: 7

  build-harmony:
    if: inputs.platform == 'all' || inputs.platform == 'harmony'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Verify Harmony SDK configuration
        env:
          HARMONY_SDK_URL: ${{ secrets.HARMONY_SDK_URL }}
          HARMONY_SDK_SHA256: ${{ vars.HARMONY_SDK_SHA256 }}
        run: |
          if [[ -z "$HARMONY_SDK_URL" ]]; then
            echo "::error::Missing HARMONY_SDK_URL repository secret. Add it at https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions. Secrets from another repository are not inherited."
            exit 1
          fi
          if [[ ! "$HARMONY_SDK_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::Invalid HARMONY_SDK_SHA256 repository variable. Set the expected SDK archive SHA-256 as 64 lowercase hexadecimal characters.'
            exit 1
          fi
          if [[ "$HARMONY_SDK_URL" != https://* ]]; then
            echo '::error::HARMONY_SDK_URL must use HTTPS. Set the complete authorized Linux SDK download URL as the repository secret.'
            exit 1
          fi
      - run: python -m pip install -r requirements-build.txt
      - name: Build Harmony ARM64 library and N-API bridge
        env:
          HARMONY_SDK_URL: ${{ secrets.HARMONY_SDK_URL }}
          HARMONY_SDK_SHA256: ${{ vars.HARMONY_SDK_SHA256 }}
        run: python scripts/build.py harmony --jobs 2
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: webrtc-apm-harmony-${{ github.run_id }}
          path: dist/webrtc-apm-harmony.zip*
          if-no-files-found: error
          retention-days: 7
